<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Hand Galaxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    html, body { background: #000; overflow: hidden; height: 100%; width: 100%; color: #fff; user-select: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .ui { position: absolute; z-index: 10; pointer-events: none; }
    .top-left { top: 16px; left: 16px; }
    .title {
      font-size: 18px; font-weight: 700; letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .title .infinity { font-size: 24px; color: #00f0ff; -webkit-text-fill-color: #00f0ff; }
    .subtitle { font-size: 11px; color: #00f0ff; margin-top: 2px; opacity: 0.8; }

    .status-box {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,12,25,0.8); border: 1px solid #00f0ff;
      border-radius: 10px; padding: 7px 12px; font-size: 12px; color: #00ff9d;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
    }
    .status-dot {
      width: 7px; height: 7px; background: #00ff9d; border-radius: 50%;
      box-shadow: 0 0 6px #00ff9d; animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .gesture-name {
      position: absolute; top: 55px; right: 16px;
      background: rgba(0,12,25,0.85); border: 1px solid #ff2d95;
      border-radius: 8px; padding: 5px 12px; font-size: 12px; color: #ff9de0;
      display: none; backdrop-filter: blur(6px);
    }

    #camera-container {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 150px; border-radius: 12px; overflow: hidden;
      border: 2px solid #00f0ff; box-shadow: 0 0 16px rgba(0,240,255,0.4);
      z-index: 20; background: #000;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #camera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 90px;
      background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
      display: flex; justify-content: center; align-items: center; gap: 32px; z-index: 30;
    }
    .btn {
      width: 54px; height: 54px; border-radius: 50%; border: 2.5px solid;
      background: transparent; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; position: relative;
    }
    .btn-camera { border-color: #00f0ff; color: #00f0ff; }
    .btn-camera:hover { background: rgba(0,240,255,0.15); box-shadow: 0 0 16px #00f0ff; }
    .btn-stop { border-color: #ff2d95; color: #ff2d95; }
    .btn-stop:hover { background: rgba(255,45,149,0.15); box-shadow: 0 0 16px #ff2d95; }
    .btn-fs { border-color: #c4f; color: #e0f; }
    .btn-fs:hover { background: rgba(180,0,255,0.15); box-shadow: 0 0 16px #c4f; }
    .btn span { position: absolute; bottom: -18px; font-size: 10px; font-weight: 600; }

    .hint { position: absolute; bottom: 14px; left: 14px; font-size: 11px; color: #888; }
    .hint-right { position: absolute; bottom: 14px; right: 14px; font-size: 11px; color: #888; }

    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #00f0ff; font-size: 15px; z-index: 100; text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    Klik <b>CAMERA</b> lalu <b>FULLSCREEN</b><br>
    <small style="opacity:0.7">Transisi sangat smooth</small>
  </div>

  <canvas id="canvas"></canvas>

  <div class="ui top-left">
    <div class="title"><span class="infinity">∞</span> NEON HAND GALAXY</div>
    <div class="subtitle">HAND GESTURE • 3D NEON PARTICLE</div>
  </div>

  <div class="status-box">
    <div class="status-dot"></div>
    <span id="statusText">Menunggu kamera...</span>
  </div>

  <div class="gesture-name" id="gestureName">—</div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="camera-overlay"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="hint">Neon galaxy particles</div>

    <button class="btn btn-camera" id="btnCamera">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>CAMERA</span>
    </button>

    <button class="btn btn-stop" id="btnStop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      <span>STOP</span>
    </button>

    <button class="btn btn-fs" id="btnFullscreen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>FULLSCREEN</span>
    </button>

    <div class="hint-right">Gesture mode</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const camOverlay = document.getElementById('camera-overlay');
    const camCtx = camOverlay.getContext('2d');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');
    const gestureNameEl = document.getElementById('gestureName');

    let W, H, particles = [], isRunning = false, camera = null;
    let currentGesture = 'none';
    let gestureStable = 'none';
    let gestureCounter = 0;
    const STABLE_FRAMES = 5;

    let centerX, centerY;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      camOverlay.width = 200;
      camOverlay.height = 150;
      centerX = W / 2;
      centerY = H / 2 - 30;
    }
    window.addEventListener('resize', resize);
    resize();

    // ===================== PARTICLE - SANGAT SMOOTH =====================
    class Particle {
      constructor() {
        this.x = centerX;
        this.y = centerY;
        this.vx = 0;
        this.vy = 0;
        this.size = 0.45 + Math.random() * 1.1;
        this.hue = 250 + Math.random() * 110;
        this.target = { x: centerX, y: centerY };
        this.angle = Math.random() * Math.PI * 2;
        this.orbitSpeed = 0.005 + Math.random() * 0.01;
        this.orbitRadius = 0.12 + Math.random() * 0.4;
      }

      update() {
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;

        // === SANGAT PELAN & SMOOTH ===
        this.vx += dx * 0.009;   // semakin kecil = semakin pelan
        this.vy += dy * 0.009;

        this.vx *= 0.94;         // damping tinggi
        this.vy *= 0.94;

        this.x += this.vx;
        this.y += this.vy;

        // micro orbit biar tetap hidup
        this.angle += this.orbitSpeed;
        this.x += Math.cos(this.angle) * this.orbitRadius;
        this.y += Math.sin(this.angle) * this.orbitRadius * 0.65;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 68%, 0.9)`;
        ctx.shadowBlur = 5;
        ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.7)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function initParticles(n = 1100) {
      particles = [];
      for (let i = 0; i < n; i++) particles.push(new Particle());
    }

    // ===================== SHAPES =====================
    function makeBall(cx, cy, r = 95) {
      const pts = [];
      for (let i = 0; i < 1100; i++) {
        const a = Math.random() * Math.PI * 2;
        const b = Math.acos(2 * Math.random() - 1);
        const radius = r * (0.7 + Math.random() * 0.3);
        pts.push({
          x: cx + radius * Math.sin(b) * Math.cos(a),
          y: cy + radius * Math.sin(b) * Math.sin(a) * 0.78
        });
      }
      return pts;
    }

    function makeDonut(cx, cy, R = 100, r = 32) {
      const pts = [];
      for (let i = 0; i < 1100; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 2;
        const rad = R + r * Math.cos(phi) * (0.85 + Math.random() * 0.15);
        pts.push({
          x: cx + rad * Math.cos(theta),
          y: cy + rad * Math.sin(theta) * 0.7
        });
      }
      return pts;
    }

    function makeHeart(cx, cy, s = 1.35) {
      const pts = [];
      for (let i = 0; i < 1100; i++) {
        const t = Math.random() * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        x += (Math.random() - 0.5) * 1.8;
        y += (Math.random() - 0.5) * 1.8;
        pts.push({ x: cx + x * s * 3.1, y: cy + y * s * 3.1 });
      }
      return pts;
    }

    function makeScatter(cx, cy) {
      const pts = [];
      for (let i = 0; i < 1100; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 30 + Math.random() * 280;
        pts.push({
          x: cx + Math.cos(a) * r,
          y: cy + Math.sin(a) * r * 0.65
        });
      }
      return pts;
    }

    function makeLetterN(cx, cy, s = 78) {
      const pts = [];
      for (let i = 0; i < 280; i++) {
        pts.push({ x: cx - s + (Math.random()-0.5)*6, y: cy - s + (i/280)*s*2 + (Math.random()-0.5)*4 });
      }
      for (let i = 0; i < 320; i++) {
        pts.push({ x: cx - s + (i/320)*s*2 + (Math.random()-0.5)*5, y: cy - s + (i/320)*s*2 + (Math.random()-0.5)*5 });
      }
      for (let i = 0; i < 280; i++) {
        pts.push({ x: cx + s + (Math.random()-0.5)*6, y: cy - s + (i/280)*s*2 + (Math.random()-0.5)*4 });
      }
      return pts;
    }

    function makeLetterR(cx, cy, s = 78) {
      const pts = [];
      for (let i = 0; i < 300; i++) {
        pts.push({ x: cx - s + (Math.random()-0.5)*5, y: cy - s + (i/300)*s*2 + (Math.random()-0.5)*4 });
      }
      for (let i = 0; i < 220; i++) {
        const a = (i/220) * Math.PI;
        pts.push({
          x: cx - s + Math.sin(a)*s*1.2 + (Math.random()-0.5)*4,
          y: cy - s + (1 - Math.cos(a))*s*0.75 + (Math.random()-0.5)*4
        });
      }
      for (let i = 0; i < 240; i++) {
        pts.push({ x: cx - s + (i/240)*s*1.6 + (Math.random()-0.5)*5, y: cy + (i/240)*s*0.95 + (Math.random()-0.5)*4 });
      }
      return pts;
    }

    function applyShape(type) {
      let pts;
      if (type === 'ball') pts = makeBall(centerX, centerY);
      else if (type === 'donut') pts = makeDonut(centerX, centerY);
      else if (type === 'heart') pts = makeHeart(centerX, centerY);
      else if (type === 'scatter') pts = makeScatter(centerX, centerY);
      else if (type === 'N') pts = makeLetterN(centerX, centerY);
      else if (type === 'R') pts = makeLetterR(centerX, centerY);
      else pts = makeBall(centerX, centerY, 60);

      for (let i = 0; i < particles.length; i++) {
        particles[i].target = pts[i % pts.length];
      }
    }

    // ===================== GESTURE =====================
    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isExtended(landmarks, tip, pip, mcp) {
      const tipToMcp = distance(landmarks[tip], landmarks[mcp]);
      const pipToMcp = distance(landmarks[pip], landmarks[mcp]);
      return tipToMcp > pipToMcp * 1.18;
    }

    function detectGesture(landmarks, handedness) {
      const isRight = handedness === 'Right';

      const thumbExt = isRight
        ? landmarks[4].x < landmarks[3].x - 0.025
        : landmarks[4].x > landmarks[3].x + 0.025;

      const indexExt  = isExtended(landmarks, 8, 6, 5);
      const middleExt = isExtended(landmarks, 12, 10, 9);
      const ringExt   = isExtended(landmarks, 16, 14, 13);
      const pinkyExt  = isExtended(landmarks, 20, 18, 17);

      const extCount = [indexExt, middleExt, ringExt, pinkyExt].filter(Boolean).length;
      const thumbIndexDist = distance(landmarks[4], landmarks[8]);

      if (!indexExt && !middleExt && !ringExt && !pinkyExt) return 'ball';
      if (extCount >= 4) return 'scatter';
      if (indexExt && !middleExt && !ringExt && !pinkyExt && thumbIndexDist < 0.06) return 'donut';
      if (indexExt && !middleExt && !ringExt && !pinkyExt && !thumbExt) return 'heart'; // ☝️
      if (thumbExt && pinkyExt && !indexExt && !middleExt && !ringExt) return 'R';
      if (extCount >= 3) return 'scatter';
      return 'ball';
    }

    // ===================== MEDIAPIPE =====================
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.72,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      camCtx.drawImage(results.image, 0, 0, camOverlay.width, camOverlay.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const handedness = results.multiHandedness[0].label;

        drawConnectors(camCtx, lm, HAND_CONNECTIONS, { color: '#00f0ff', lineWidth: 1.5 });
        drawLandmarks(camCtx, lm, { color: '#ff2d95', lineWidth: 1, radius: 2.2 });

        const rawGesture = detectGesture(lm, handedness);

        if (rawGesture === currentGesture) {
          gestureCounter++;
        } else {
          gestureCounter = 0;
          currentGesture = rawGesture;
        }

        if (gestureCounter >= STABLE_FRAMES && gestureStable !== currentGesture) {
          gestureStable = currentGesture;
          applyShape(gestureStable);

          const names = {
            ball: 'BOLA',
            donut: 'DONAT',
            heart: 'LOVE',
            scatter: 'HANCUR',
            N: 'HURUF N',
            R: 'HURUF R'
          };
          gestureNameEl.style.display = 'block';
          gestureNameEl.textContent = names[gestureStable] || gestureStable;
        }

        statusText.textContent = 'HAND DETECTED';
      } else {
        currentGesture = 'none';
        gestureCounter = 0;
        gestureNameEl.style.display = 'none';
        statusText.textContent = 'Mencari tangan...';
      }
      camCtx.restore();
    }

    // ===================== ANIMATE =====================
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 4, 0.18)';
      ctx.fillRect(0, 0, W, H);

      for (const p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }

    // ===================== CONTROLS =====================
    document.getElementById('btnCamera').onclick = async () => {
      if (isRunning) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 }
        });
        video.srcObject = stream;
        await video.play();

        camera = new Camera(video, {
          onFrame: async () => await hands.send({ image: video }),
          width: 640,
          height: 480
        });
        camera.start();
        isRunning = true;
        loading.style.display = 'none';
        initParticles(1100);
        applyShape('ball');
        statusText.textContent = 'Kamera aktif';
      } catch (e) {
        alert('Izinkan akses kamera');
      }
    };

    document.getElementById('btnStop').onclick = () => {
      if (camera) { camera.stop(); camera = null; }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      isRunning = false;
      particles = [];
      gestureStable = 'none';
      gestureNameEl.style.display = 'none';
      statusText.textContent = 'Stopped';
      loading.style.display = 'block';
      loading.innerHTML = 'Kamera dimatikan<br><small>Klik CAMERA untuk mulai</small>';
    };

    document.getElementById('btnFullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    initParticles(800);
    applyShape('ball');
    animate();
  </script>
</body>
</html>
